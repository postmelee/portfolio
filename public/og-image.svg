    <text x="99" y="505" font-size="17" font-weight="700" fill="#17191D">SELECTED PROJECTS</text>
    <text x="99" y="540" font-size="19" font-weight="600" fill="#4B5563">rhwp  ·  alhangeul-macos  ·  heartrace</text>
    <text x="1089" y="540" text-anchor="end" font-size="17" font-weight="600" fill="#4B5563">postmelee.github.io/portfolio</text>
  </g>

  <g transform="translate(866 150)">
