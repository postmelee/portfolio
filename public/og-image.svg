<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="80" y1="30" x2="1120" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFAF7"/>
      <stop offset="1" stop-color="#F1F3F8"/>
    </linearGradient>
    <linearGradient id="accent" x1="830" y1="98" x2="1124" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8DCF9"/>
      <stop offset="0.48" stop-color="#D9D6F8"/>
      <stop offset="1" stop-color="#F6D9CC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1050" cy="112" r="132" fill="#C9DDFC" opacity="0.52" filter="url(#blur)"/>
  <circle cx="950" cy="520" r="158" fill="#F3D4C7" opacity="0.55" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <rect x="58" y="48" width="1084" height="534" rx="34" fill="white" fill-opacity="0.82"/>
    <rect x="58.75" y="48.75" width="1082.5" height="532.5" rx="33.25" stroke="#111827" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>

  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
