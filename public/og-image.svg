    <text x="107" y="98" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="44" font-weight="750" fill="#24262B">이</text>
    <rect x="42" y="151" width="130" height="14" rx="7" fill="white" fill-opacity="0.8"/>
    <rect x="66" y="181" width="82" height="10" rx="5" fill="white" fill-opacity="0.58"/>
