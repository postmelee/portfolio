    <text x="124" y="121" text-anchor="middle" font-size="27" font-weight="700" fill="white">이</text>
    <text x="170" y="105" font-size="21" font-weight="700" fill="#17191D">이태규</text>
    <text x="170" y="132" font-size="16" font-weight="500" fill="#6B7280">Frontend Developer · Open Source Maintainer</text>

    <text x="96" y="222" font-size="58" font-weight="760" letter-spacing="-2.5" fill="#17191D">제품과 오픈소스를 만드는</text>
    <text x="96" y="296" font-size="58" font-weight="760" letter-spacing="-2.5" fill="#17191D">프론트엔드 개발자</text>
    <text x="99" y="344" font-size="22" font-weight="500" fill="#555B66">사용자 경험을 제품으로 만들고, 검증 가능한 오픈소스로 확장합니다.</text>

    <g font-size="17" font-weight="650" fill="#353A43">
      <rect x="96" y="384" width="116" height="42" rx="21" fill="#F5F6F8" stroke="#111827" stroke-opacity="0.08"/>
      <text x="154" y="411" text-anchor="middle">React</text>
      <rect x="224" y="384" width="144" height="42" rx="21" fill="#F5F6F8" stroke="#111827" stroke-opacity="0.08"/>
      <text x="296" y="411" text-anchor="middle">TypeScript</text>
      <rect x="380" y="384" width="122" height="42" rx="21" fill="#F5F6F8" stroke="#111827" stroke-opacity="0.08"/>
      <text x="441" y="411" text-anchor="middle">SwiftUI</text>
      <rect x="514" y="384" width="150" height="42" rx="21" fill="#F5F6F8" stroke="#111827" stroke-opacity="0.08"/>
      <text x="589" y="411" text-anchor="middle">Rust / WASM</text>
